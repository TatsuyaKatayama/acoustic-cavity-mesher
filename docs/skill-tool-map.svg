<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1216" viewBox="0 0 1500 1216" role="img" aria-labelledby="title">
<title id="title">内部空間メッシュ作成とテンプレート化のスキル・ツール対応表</title>
<style>text{font-family:'Yu Gothic','Meiryo','Noto Sans CJK JP',sans-serif;fill:#152a40}.title{font-size:30px;font-weight:700}.sub{font-size:15px;fill:#435c74}.head{font-size:15px;font-weight:700;fill:#fff}.group{font-size:15px;font-weight:700}.skill,.body,.ais{font-size:14px}.skill,.ais{font-weight:700}.ais{fill:#125982}.white{fill:#fff}.stripe{fill:#f3f7fb}.section{fill:#ddeaf5}.header{fill:#253e59}.note{fill:#eaf3fa}</style>
<rect x="0" y="0" width="1500" height="1216" rx="0" class="white"/>
<text x="28" y="47" class="title">スキルとツールの対応表</text>
<text x="28" y="79" class="sub">A｜内部空間メッシュ作成　　B｜テンプレート作成・改訂　　確認画面｜OCCT AIS</text>
<rect x="28" y="103" width="1444" height="40" rx="6" class="header"/>
<text x="43" y="129" class="head">スキル</text><text x="323" y="129" class="head">呼び出すツール・操作</text><text x="704" y="129" class="head">実装基盤</text><text x="981" y="129" class="head">成果物・確認内容</text>
<rect x="28" y="143" width="1444" height="30" rx="0" class="section"/><text x="43" y="164" class="group">入力・抽出</text><rect x="28" y="173" width="1444" height="29" rx="0" class="white"/><text x="43" y="193" class="skill">部品・配置の抽出</text><text x="323" y="193" class="body">アセンブリ抽出</text><text x="704" y="193" class="body">OCCT XDE</text><text x="981" y="193" class="body">部品形状・配置ID・変換を取得</text><rect x="28" y="202" width="1444" height="29" rx="0" class="stripe"/><text x="43" y="222" class="skill">寸法リストの整理</text><text x="323" y="222" class="body">寸法入力の正規化</text><text x="704" y="222" class="body">Python</text><text x="981" y="222" class="body">部品・単位・配置を揃える</text><rect x="28" y="231" width="1444" height="29" rx="0" class="white"/><text x="43" y="251" class="skill">抽出結果の照合</text><text x="323" y="251" class="body">抽出結果の照合</text><text x="704" y="251" class="body">OCCT XDE／Python</text><text x="981" y="251" class="body">欠落・重複・配置を確認</text><rect x="28" y="268" width="1444" height="30" rx="0" class="section"/><text x="43" y="289" class="group">簡略化方針・テンプレート</text><rect x="28" y="298" width="1444" height="29" rx="0" class="white"/><text x="43" y="318" class="skill">簡略化候補の分類</text><text x="323" y="318" class="body">面・形状の計測／分類の保存</text><text x="704" y="318" class="body">OCCT／Python</text><text x="981" y="318" class="body">残す・省略・要確認は方針担当が分類</text><rect x="28" y="327" width="1444" height="29" rx="0" class="stripe"/><text x="43" y="347" class="skill">接合面の対応づけ</text><text x="323" y="347" class="body">接合面候補の抽出</text><text x="704" y="347" class="body">OCCT</text><text x="981" y="347" class="body">距離・向き・重なりから面の組を提案</text><rect x="28" y="356" width="1444" height="29" rx="0" class="white"/><text x="43" y="376" class="skill">CAD面の色付け</text><text x="323" y="376" class="body">接合面レビュー画面</text><text x="704" y="376" class="ais">OCCT AIS</text><text x="981" y="376" class="body">対応面を同色で表示。単離・クリップ・面選択</text><rect x="28" y="385" width="1444" height="29" rx="0" class="stripe"/><text x="43" y="405" class="skill">方針案の検査</text><text x="323" y="405" class="body">方針記録の照合／接合面レビュー画面</text><text x="704" y="405" class="ais">Python／OCCT AIS</text><text x="981" y="405" class="body">未分類や接合面ペアの抜けを確認</text><rect x="28" y="414" width="1444" height="29" rx="0" class="white"/><text x="43" y="434" class="skill">人の指示の反映</text><text x="323" y="434" class="body">レビュー結果の保存</text><text x="704" y="434" class="ais">Python＋OCCT AIS</text><text x="981" y="434" class="body">承認・修正、隙間条件を面IDにひもづける</text><rect x="28" y="443" width="1444" height="29" rx="0" class="stripe"/><text x="43" y="463" class="skill">簡略形状の定義</text><text x="323" y="463" class="body">パラメータ形状の生成</text><text x="704" y="463" class="body">CadQuery／OCCT</text><text x="981" y="463" class="body">操作順・基準・可変寸法を版管理</text><rect x="28" y="472" width="1444" height="29" rx="0" class="white"/><text x="43" y="492" class="skill">フィット条件の定義</text><text x="323" y="492" class="body">フィット条件の検証</text><text x="704" y="492" class="body">Python／OCCT</text><text x="981" y="492" class="body">寸法の取得基準・接合面参照を照合</text><rect x="28" y="501" width="1444" height="29" rx="0" class="stripe"/><text x="43" y="521" class="skill">テンプレートの登録</text><text x="323" y="521" class="body">テンプレートの登録</text><text x="704" y="521" class="body">Python</text><text x="981" y="521" class="body">版・適用範囲・検証結果を保存</text><rect x="28" y="538" width="1444" height="30" rx="0" class="section"/><text x="43" y="559" class="group">フィット・差分評価</text><rect x="28" y="568" width="1444" height="29" rx="0" class="white"/><text x="43" y="588" class="skill">テンプレート選定</text><text x="323" y="588" class="body">テンプレート候補の抽出</text><text x="704" y="588" class="body">OCCT／Python</text><text x="981" y="588" class="body">面・辺の構成と基準面の対応で絞る</text><rect x="28" y="597" width="1444" height="29" rx="0" class="stripe"/><text x="43" y="617" class="skill">フィッティング</text><text x="323" y="617" class="body">寸法計測／パラメータ調整</text><text x="704" y="617" class="body">OCCT／CadQuery／Python</text><text x="981" y="617" class="body">調整値と簡易形状を出力</text><rect x="28" y="626" width="1444" height="29" rx="0" class="white"/><text x="43" y="646" class="skill">形状差分の計測</text><text x="323" y="646" class="body">形状差分の計測</text><text x="704" y="646" class="body">OCCT</text><text x="981" y="646" class="body">体積・外形・評価範囲内の空間差を計測</text><rect x="28" y="655" width="1444" height="29" rx="0" class="stripe"/><text x="43" y="675" class="skill">重ね合わせの表示</text><text x="323" y="675" class="body">差分レビュー画面</text><text x="704" y="675" class="ais">OCCT AIS</text><text x="981" y="675" class="body">詳細形状と簡易形状を重ねて確認</text><rect x="28" y="684" width="1444" height="29" rx="0" class="white"/><text x="43" y="704" class="skill">① フィット到達度の判定</text><text x="323" y="704" class="body">フィット残差の判定</text><text x="704" y="704" class="body">Python</text><text x="981" y="704" class="body">基準・寸法の残差を条件と照合</text><rect x="28" y="713" width="1444" height="29" rx="0" class="stripe"/><text x="43" y="733" class="skill">② 簡略形状の適合判定</text><text x="323" y="733" class="body">形状差の判定</text><text x="704" y="733" class="body">Python</text><text x="981" y="733" class="body">空間誤差などをしきい値と照合</text><rect x="28" y="742" width="1444" height="29" rx="0" class="white"/><text x="43" y="762" class="skill">NG根拠の記録</text><text x="323" y="762" class="body">判定・続行判断の保存</text><text x="704" y="762" class="body">Python</text><text x="981" y="762" class="body">測定値・しきい値・対象箇所・人の判断</text><rect x="28" y="779" width="1444" height="30" rx="0" class="section"/><text x="43" y="800" class="group">再組み立て・空間CAD</text><rect x="28" y="809" width="1444" height="29" rx="0" class="white"/><text x="43" y="829" class="skill">簡易部品の再組み立て</text><text x="323" y="829" class="body">部品の配置復元</text><text x="704" y="829" class="body">OCCT</text><text x="981" y="829" class="body">簡易部品と外側埋め形状を配置</text><rect x="28" y="838" width="1444" height="29" rx="0" class="stripe"/><text x="43" y="858" class="skill">接合・開口の検査</text><text x="323" y="858" class="body">隙間・食い込み計測／開口検査</text><text x="704" y="858" class="body">OCCT／Python</text><text x="981" y="858" class="body">B2で確定した面ペアと接合条件を使用</text><rect x="28" y="867" width="1444" height="29" rx="0" class="white"/><text x="43" y="887" class="skill">円筒との差し引き</text><text x="323" y="887" class="body">ブーリアン差</text><text x="704" y="887" class="body">OCCT</text><text x="981" y="887" class="body">接合チェック後に内部空間を生成</text><rect x="28" y="896" width="1444" height="29" rx="0" class="stripe"/><text x="43" y="916" class="skill">内部空間の検査</text><text x="323" y="916" class="body">連通検査／微小形状検査</text><text x="704" y="916" class="body">OCCT／Python</text><text x="981" y="916" class="body">外側への漏れ・分断・微小面を確認</text><rect x="28" y="933" width="1444" height="30" rx="0" class="section"/><text x="43" y="954" class="group">メッシュ・解析入力</text><rect x="28" y="963" width="1444" height="29" rx="0" class="white"/><text x="43" y="983" class="skill">物性領域の設定</text><text x="323" y="983" class="body">領域分割／領域IDの付与</text><text x="704" y="983" class="body">Gmsh Python API</text><text x="981" y="983" class="body">共有境界を作り、領域IDを保持</text><rect x="28" y="992" width="1444" height="29" rx="0" class="stripe"/><text x="43" y="1012" class="skill">テトラメッシュ生成</text><text x="323" y="1012" class="body">テトラメッシュ生成</text><text x="704" y="1012" class="body">Gmsh Python API</text><text x="981" y="1012" class="body">物性境界に要素面を合わせる</text><rect x="28" y="1021" width="1444" height="29" rx="0" class="white"/><text x="43" y="1041" class="skill">解析入力の出力</text><text x="323" y="1041" class="body">BDF出力／INPメッシュ出力</text><text x="704" y="1041" class="body">pyNastran／Python</text><text x="981" y="1041" class="body">Nastran用BDF、CalculiX用の領域セット付きメッシュ</text><rect x="28" y="1050" width="1444" height="29" rx="0" class="stripe"/><text x="43" y="1070" class="skill">メッシュ品質の検査</text><text x="323" y="1070" class="body">要素品質計測／物性境界の照合</text><text x="704" y="1070" class="body">Gmsh Python API／Python</text><text x="981" y="1070" class="body">品質と境界への適合を確認</text><rect x="28" y="1079" width="1444" height="29" rx="0" class="white"/><text x="43" y="1099" class="skill">解析入力の照合</text><text x="323" y="1099" class="body">BDF照合／INPメッシュ照合</text><text x="704" y="1099" class="body">pyNastran／Python</text><text x="981" y="1099" class="body">要素とプロパティ・領域セットを照合</text>
<rect x="28" y="1120" width="1444" height="72" rx="8" class="note"/>
<text x="43" y="1146" class="sub">入力はSTEPアセンブリを第一候補とし、Parasolid直接入力は検証対象。CalculiXの音響デッキはメッシュ出力と別に検証する。</text>
<text x="43" y="1170" class="sub">自動処理は単一機能のCLI／APIで呼び出す。AISは候補と差分を人が確認し、確定した面ペア・接合条件を後続の検査に渡す。</text>
</svg>
