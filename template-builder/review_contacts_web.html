<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>B2 接合面レビュー</title>
<link rel="stylesheet" href="/assets/css/three-cad-viewer.css">
<style>
*{box-sizing:border-box}body{margin:0;background:#eef2f7;color:#213148;font:16px system-ui,sans-serif}header{height:62px;background:#12263d;color:white;display:flex;align-items:center;justify-content:space-between;padding:0 24px}h1{font-size:20px;margin:0}header span{color:#b7c9dd;font-size:14px}main{display:grid;grid-template-columns:370px minmax(0,1fr);height:calc(100dvh - 62px)}aside{overflow:auto;background:#fff;padding:20px;border-right:1px solid #ccd6e2}label{display:block;font-size:14px;font-weight:600;margin:14px 0 7px}select,input,textarea,button{font:inherit;border:1px solid #b2c0d0;border-radius:5px;padding:8px;background:white;color:inherit}select,textarea{width:100%}button{cursor:pointer}button:disabled{opacity:.5;cursor:default}input[type=number]{width:100%}textarea{height:95px;resize:vertical}#save{background:#155eaa;color:white;width:100%;margin-top:18px;border-color:#155eaa}.row{display:flex;gap:8px}.row>*{flex:1;min-width:0}.metric{background:#eef4fb;border-left:3px solid #2573b8;padding:12px;line-height:1.7;font-size:14px;white-space:pre-wrap}#refs{font-size:14px;overflow-wrap:anywhere;line-height:1.7}.hint{font-size:14px;color:#53667c;line-height:1.6}.stage{display:grid;grid-template-rows:auto minmax(0,1fr);min-width:0;min-height:0}.tools{padding:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:#f8fafc}.tools select{width:auto;max-width:260px;font-size:14px}.tools button{font-size:14px}#viewport{position:relative;overflow:hidden;min-height:0;contain:size layout}#message{font-size:14px;line-height:1.6;white-space:pre-wrap;padding:10px 0}#message[data-error=true]{color:#b42318}#clip{width:130px;padding:0}.tcv_cad_navigation{display:flex!important;height:max(0px,calc(100% - 90px))!important;pointer-events:none}.tcv_cad_navigation>*{pointer-events:auto}.tcv_cad_tree{flex:1 1 0;min-height:0;max-height:none!important}.tcv_cad_info_wrapper{flex:0 0 auto;max-height:25%}@media(max-width:900px){main{grid-template-columns:300px minmax(0,1fr)}aside{padding:12px}}
</style>
<header><h1>B2 接合面レビュー</h1><span>詳細CAD · mm · 判断はレビュー保存で確定</span></header>
<main>
<aside>
<label for="candidate">接合候補</label><select id="candidate"></select>
<p id="progress" class="hint"></p>
<p id="renderwarning" class="hint" role="alert"></p>
<div id="metrics" class="metric">読み込み中…</div>
<p id="refs"></p>
<label for="decision">判断</label><select id="decision"><option value="pending">未確認</option><option value="accepted">採用</option><option value="rejected">除外</option></select>
<label for="mode">接合条件</label><select id="mode"><option value="close">塞ぐ</option><option value="keep_gap">隙間を残す</option></select>
<div class="row"><div><label for="target">目標隙間 mm</label><input id="target" type="number" step="any" min="0" value="0"></div><div><label for="tolerance">±許容差 mm</label><input id="tolerance" type="number" step="any" min="0" value="0"></div></div>
<label for="notes">簡略化メモ</label><textarea id="notes" placeholder="残す内壁・開口・小形状、例外など"></textarea>
<button id="save" disabled>レビュー保存</button>
<button id="revert">未保存の変更を戻す</button>
<p id="message" role="status" aria-live="polite"></p>
<p class="hint">オレンジ色が対応する2面です。片側表示・断面で隠れた面を確認してください。面の差し替えは選択モードを選び、CAD面をクリックします。</p>
<p class="hint">この画面はB2のみ。B3向け出力は全件判断後に専用CLIで行います。円筒対応はB2の範囲です。</p>
</aside>
<section class="stage">
<div class="tools">
<select id="isolate" aria-label="表示範囲"><option value="pair">対象2部品</option><option value="first">1面目の部品のみ</option><option value="second">2面目の部品のみ</option><option value="all">全体</option></select>
<select id="pick" aria-label="面の差し替え"><option value="off">操作モード</option><option value="0">1面目をクリックで差し替え</option><option value="1">2面目をクリックで差し替え</option></select>
<button id="fit">表示範囲に合わせる</button>
<select id="clipaxis" aria-label="断面軸"><option value="off">断面なし</option><option value="0">X断面</option><option value="1">Y断面</option><option value="2">Z断面</option></select>
<input id="clip" aria-label="断面位置" type="range" min="0" max="100" value="50">
</div><div id="viewport"></div>
</section></main>
<script type="module" src="/review_contacts_web.js"></script>
</html>
