<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CAD比較</title>
<link rel="stylesheet" href="/assets/css/three-cad-viewer.css">
<style>
  body { margin: 0; font: 14px system-ui, sans-serif; color: #243449; background: #eef2f7; }
  main { display: grid; grid-template-columns: repeat(2, minmax(450px, 1fr)); height: 100dvh; gap: 2px; }
  section { display: grid; grid-template-rows: auto minmax(0, 1fr); min-width: 0; min-height: 0; }
  h1, h2 { margin: 0; padding: 9px 14px; font-size: 14px; font-weight: 600; }
  .heading { display: flex; align-items: center; gap: 6px; padding-right: 8px; }
  .heading h1, .heading h2 { margin-right: auto; }
  .heading button { font: inherit; color: inherit; background: white; border: 1px solid #b9c7d7; border-radius: 5px; padding: 3px 9px; cursor: pointer; }
  .heading button[aria-pressed="true"] { background: #dbeafe; border-color: #6894c5; }
  .viewport { position: relative; min-width: 0; min-height: 0; overflow: hidden; contain: size layout; }
  .viewport .tcv_cad_navigation {
    display: flex !important;
    height: max(0px, calc(100% - 90px)) !important;
    pointer-events: none;
  }
  .viewport .tcv_cad_navigation > * { pointer-events: auto; }
  .viewport .tcv_cad_tree { flex: 1 1 0; min-height: 0; max-height: none !important; }
  .viewport .tcv_cad_info_wrapper { flex: 0 0 auto; max-height: 30%; min-height: 22px; }
  .shape-ids { position: absolute; z-index: 110; bottom: 32px; right: 8px; max-width: 65%; margin: 0; padding: 8px; border: 1px solid #b9c7d7; border-radius: 5px; background: white; white-space: pre-wrap; overflow-wrap: anywhere; user-select: text; }
  #error:empty { display: none; }
  #error { position: fixed; z-index: 10000; bottom: 0; background: #fee2e2; padding: 10px; }
</style>
<main>
  <section>
    <div class="heading"><h1>詳細形状</h1><a href="/viewer-licenses" target="_blank" rel="noopener">ライセンス</a><button data-tool="distance">距離計測</button><button data-tool="properties">形状プロパティ</button><button data-tool="select" aria-pressed="false">ID確認</button><button data-tool="off">操作に戻る</button></div>
    <div id="detailed" class="viewport"></div>
  </section>
  <section>
    <div class="heading"><h2>簡易形状</h2><button data-tool="distance">距離計測</button><button data-tool="properties">形状プロパティ</button><button data-tool="select" aria-pressed="false">ID確認</button><button data-tool="off">操作に戻る</button></div>
    <div id="simplified" class="viewport"></div>
  </section>
</main>
<p id="error" role="alert"></p>
<script type="module">
  import { Viewer, Display, Timer } from "/assets/js/three-cad-viewer.esm.js";
  import { createPage } from "/assets/js/ocp-viewer-core/page.js";

  const viewers = [];
  const cameraKeys = ["position", "quaternion", "target"];
  let pending = null;
  let scheduled = false;
  let activePane = null;

  function copyCamera(origin, camera) {
    const other = viewers[1 - origin];
    if (!other) return;
    other.setCameraLocationSettings(camera.position, camera.quaternion, camera.target, camera.zoom, false);
  }

  function onStatus(origin, type, status) {
    if (origin !== activePane || type !== "status" || viewers.length !== 2
        || !cameraKeys.every((key) => Array.isArray(status[key]))
        || !Number.isFinite(status.zoom)) return;
    pending = [origin, status];
    if (scheduled) return;
    scheduled = true;
    requestAnimationFrame(() => {
      scheduled = false;
      if (pending[0] === activePane) copyCamera(...pending);
    });
  }

  function mount(id, index, model) {
    const container = document.getElementById(id);
    const output = document.createElement("pre");
    output.className = "shape-ids";
    output.setAttribute("aria-live", "polite");
    output.hidden = true;
    const instruction = "上部のフィルターで Face または Edge を選び、対象をクリック。";
    for (const event of ["pointerdown", "wheel", "keydown"]) {
      container.addEventListener(event, () => { activePane = index; }, { capture: true, passive: true });
    }
    class PaneViewer extends Viewer {
      constructor(...args) {
        super(...args);
        viewers[index] = this;
      }
    }
    const page = createPage({
      Viewer: PaneViewer, Display, Timer, container, listen: false, theme: "light",
      getSize: () => ({ width: container.clientWidth, height: container.clientHeight }),
      overrides: {
        display: {
          theme: "light", glass: true, tools: true, treeWidth: 220, externalMeasurementBackend: false,
        },
        viewer: { control: "trackball", up: "Z", tools: true, glass: true },
      },
      send: (type, status) => {
        if (!output.hidden && type === "status" && status.selected !== undefined) {
          const lines = Object.entries(status.selected ?? {})
            .map(([path, ids]) => `${path}: ${ids.join(", ")}`);
          output.textContent = lines.length ? lines.join("\n") : instruction;
        }
        onStatus(index, type, status);
      },
    });
    page.handleMessage(model);
    container.append(output);
    const idButton = container.parentElement.querySelector('[data-tool="select"]');
    container.parentElement.querySelectorAll("[data-tool]").forEach((button) => {
      button.addEventListener("click", () => {
        output.hidden = button !== idButton;
        idButton.setAttribute("aria-pressed", String(!output.hidden));
        output.textContent = instruction;
        page.handleMessage({ type: "ui", config: { analysisTool: button.dataset.tool } });
      });
    });
    window.addEventListener("resize", () => page.resize());
  }

  try {
    const response = await fetch("/models.json");
    if (!response.ok) throw new Error("モデルを読み込めませんでした。");
    const [detailed, simplified] = await response.json();
    mount("detailed", 0, detailed);
    mount("simplified", 1, simplified);
    copyCamera(0, viewers[0].getCameraLocationSettings());
  } catch (error) {
    document.getElementById("error").textContent = error.message;
    console.error(error);
  }
</script>
</html>
