<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CAD比較</title>
<link rel="stylesheet" href="/assets/css/three-cad-viewer.css">
<style>
  body { margin: 0; font: 14px system-ui, sans-serif; color: #243449; background: #eef2f7; }
  main { display: grid; grid-template-columns: repeat(2, minmax(450px, 1fr)); height: 100dvh; gap: 2px; }
  section { display: grid; grid-template-rows: auto minmax(0, 1fr); min-width: 0; min-height: 0; }
  h1, h2 { margin: 0; padding: 9px 14px; font-size: 14px; font-weight: 600; }
  .viewport { position: relative; min-width: 0; min-height: 0; overflow: hidden; contain: size layout; }
  #error:empty { display: none; }
  #error { position: fixed; z-index: 10000; bottom: 0; background: #fee2e2; padding: 10px; }
</style>
<main>
  <section><h1>詳細形状</h1><div id="detailed" class="viewport"></div></section>
  <section><h2>簡易形状</h2><div id="simplified" class="viewport"></div></section>
</main>
<p id="error" role="alert"></p>
<script type="module">
  import { Viewer, Display, Timer } from "/assets/js/three-cad-viewer.esm.js";
  import { createPage } from "/assets/js/ocp-viewer-core/page.js";

  const viewers = [];
  const cameraKeys = ["position", "quaternion", "target"];
  let pending = null;
  let scheduled = false;
  let activePane = null;

  function copyCamera(origin, camera) {
    const other = viewers[1 - origin];
    if (!other) return;
    other.setCameraLocationSettings(camera.position, camera.quaternion, camera.target, camera.zoom, false);
  }

  function onStatus(origin, type, status) {
    if (origin !== activePane || type !== "status" || viewers.length !== 2
        || !cameraKeys.every((key) => Array.isArray(status[key]))
        || !Number.isFinite(status.zoom)) return;
    pending = [origin, status];
    if (scheduled) return;
    scheduled = true;
    requestAnimationFrame(() => {
      scheduled = false;
      if (pending[0] === activePane) copyCamera(...pending);
    });
  }

  function mount(id, index, model) {
    const container = document.getElementById(id);
    for (const event of ["pointerdown", "wheel", "keydown"]) {
      container.addEventListener(event, () => { activePane = index; }, { capture: true, passive: true });
    }
    class PaneViewer extends Viewer {
      constructor(...args) {
        super(...args);
        viewers[index] = this;
      }
    }
    const page = createPage({
      Viewer: PaneViewer, Display, Timer, container, listen: false, theme: "light",
      getSize: () => ({ width: container.clientWidth, height: container.clientHeight }),
      overrides: {
        display: { theme: "light", glass: true, tools: true, treeWidth: 155 },
        viewer: { control: "trackball", up: "Z", tools: true, glass: true },
      },
      send: (type, status) => onStatus(index, type, status),
    });
    page.handleMessage(model);
    window.addEventListener("resize", () => page.resize());
  }

  try {
    const response = await fetch("/models.json");
    if (!response.ok) throw new Error("モデルを読み込めませんでした。");
    const [detailed, simplified] = await response.json();
    mount("detailed", 0, detailed);
    mount("simplified", 1, simplified);
    copyCamera(0, viewers[0].getCameraLocationSettings());
  } catch (error) {
    document.getElementById("error").textContent = error.message;
    console.error(error);
  }
</script>
</html>
