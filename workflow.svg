<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="1070" viewBox="0 0 1260 1070" role="img" aria-labelledby="heading">
<title id="heading">内部空間メッシュ作成とテンプレート化のワークフロー</title>
<style>text{font-family:'Yu Gothic','Meiryo','Noto Sans CJK JP',sans-serif;fill:#18283d}.head{font-size:25px;font-weight:700}.label{font-size:17px;font-weight:700}.body{font-size:14px}.muted{font-size:14px;fill:#425a71}.box{fill:#fff;stroke:#b8c7d8}.human{fill:#fff2d2;stroke:#c9a05b}.line{fill:none;stroke:#627b93;stroke-width:1.65}.rail{fill:#f3f7fb}.parallel{fill:#e8f1ff;stroke:#7799c3;stroke-dasharray:5 4}.note{fill:#e8eef6}.join{fill:#627b93}</style>
<defs><marker id="tip" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L7 4L0 8Z" fill="#627b93"/></marker></defs>
<rect width="1260" height="1070" fill="#fff"/>
<rect x="16" y="16" width="654" height="1006" rx="17" class="rail"/><rect x="686" y="16" width="558" height="1006" rx="17" class="rail"/>
<text x="36" y="53" class="head">A　内部空間メッシュ作成｜設計者</text>
<text x="36" y="83" class="muted">入力｜Parasolidアセンブリ／寸法リスト</text>
<text x="36" y="106" class="muted">ワークフロー実行側（ACP経由）｜並列起動・集約・判断待ち</text>
<rect x="36" y="122" width="614" height="321" rx="13" class="parallel"/>
<text x="52" y="149" class="label">部品単位で並列実行</text>
<path d="M343 154V166H194V191" class="line" marker-end="url(#tip)"/><path d="M343 166H492V191" class="line" marker-end="url(#tip)"/>
<text x="59" y="186" class="muted">部品 1</text><text x="357" y="186" class="muted">部品 2 … N（同じ流れ）</text>
<rect x="51" y="196" width="286" height="87" rx="10" class="box"/><text x="66" y="221" class="label">A1　抽出</text><text x="66" y="241" class="body">抽出担当｜部品・配置を取得</text><text x="66" y="261" class="body">抽出チェッカー｜欠落・配置を確認</text><path d="M194 283V296" class="line" marker-end="url(#tip)"/><rect x="51" y="300" width="286" height="107" rx="10" class="box"/><text x="66" y="325" class="label">A2　フィット</text><text x="66" y="345" class="body">フィット担当｜可能な限り合わせる</text><text x="66" y="365" class="body">フィットチェッカー</text><text x="66" y="385" class="body">① フィット到達度　② 空間誤差等</text><rect x="349" y="196" width="286" height="87" rx="10" class="box"/><text x="364" y="221" class="label">A1　抽出</text><text x="364" y="241" class="body">抽出担当｜部品・配置を取得</text><text x="364" y="261" class="body">抽出チェッカー｜欠落・配置を確認</text><path d="M492 283V296" class="line" marker-end="url(#tip)"/><rect x="349" y="300" width="286" height="107" rx="10" class="box"/><text x="364" y="325" class="label">A2　フィット</text><text x="364" y="345" class="body">フィット担当｜可能な限り合わせる</text><text x="364" y="365" class="body">フィットチェッカー</text><text x="364" y="385" class="body">① フィット到達度　② 空間誤差等</text>
<path d="M194 407V428H492V407" class="line"/><circle cx="343" cy="428" r="3" class="join"/><path d="M343 428V469" class="line" marker-end="url(#tip)"/><text x="358" y="462" class="muted">全部品の結果を集約</text>
<rect x="49" y="473" width="588" height="87" rx="10" class="human"/><text x="64" y="498" class="label">設計者が確認</text><text x="64" y="518" class="body">2段階の判定を見て、NGでも続行するか判断。停止を選べば終了。</text><text x="64" y="538" class="body">NGの理由と判断は、続行・停止ともに記録。</text>
<path d="M343 560V582" class="line" marker-end="url(#tip)"/><text x="358" y="580" class="muted">続行</text>
<rect x="49" y="586" width="588" height="107" rx="10" class="box"/><text x="64" y="611" class="label">A3–A4　空間CAD</text><text x="64" y="631" class="body">空間CAD担当｜簡易部品を組み戻し、円筒から差し引く</text><text x="64" y="651" class="body">空間CADチェッカー｜再組後の隙間・開口を確認してから差し引きへ</text><text x="64" y="671" class="body">差し引き後に漏れ・分断・微小面を確認</text>
<path d="M343 693V715" class="line" marker-end="url(#tip)"/>
<rect x="49" y="719" width="588" height="87" rx="10" class="box"/><text x="64" y="744" class="label">A5–A6　メッシュ</text><text x="64" y="764" class="body">メッシュ担当｜必要に応じて物性境界で分割・テトラ生成・Nastran出力</text><text x="64" y="784" class="body">メッシュチェッカー｜要素品質・物性境界・プロパティを確認</text>
<path d="M343 806V826" class="line" marker-end="url(#tip)"/><text x="49" y="852" class="label">出力｜内部空間テトラメッシュ・Nastran入力</text>
<rect x="49" y="901" width="588" height="67" rx="10" class="note"/><text x="64" y="926" class="label">A2のNG記録 → Bの改訂時に参照</text><text x="64" y="946" class="body">対象部品・テンプレート版・判定項目・該当箇所・測定値・しきい値・判断</text>
<text x="706" y="53" class="head">B　テンプレート作成・改訂｜主にあなた</text>
<text x="706" y="83" class="muted">入力｜詳細CAD・周辺部品／改訂時はA2のNG記録</text>
<rect x="706" y="104" width="518" height="87" rx="10" class="box"/><text x="721" y="129" class="label">B1　抽出</text><text x="721" y="149" class="body">抽出担当｜対象部品・隣接部品・元の配置を取得</text><text x="721" y="169" class="body">抽出チェッカー｜対象・隣接関係・配置を確認</text>
<path d="M965 191V207" class="line" marker-end="url(#tip)"/>
<rect x="706" y="211" width="518" height="87" rx="10" class="box"/><text x="721" y="236" class="label">B2　簡略化方針</text><text x="721" y="256" class="body">方針担当｜残す・省略する形状と、相手部品との接合面を色分け</text><text x="721" y="276" class="body">方針チェッカー｜接合面のペア・内壁・開口の判断漏れを確認</text>
<path d="M965 298V314" class="line" marker-end="url(#tip)"/>
<rect x="706" y="318" width="518" height="87" rx="10" class="human"/><text x="721" y="343" class="label">あなたが確認</text><text x="721" y="363" class="body">色付きCADで対応する面を指定し、塞ぐ箇所と残す隙間を決める。</text><text x="721" y="383" class="body">相手部品・対応面・期待する接合状態を記録。</text>
<path d="M965 405V421" class="line" marker-end="url(#tip)"/>
<rect x="706" y="425" width="518" height="87" rx="10" class="box"/><text x="721" y="450" class="label">B3–B4　テンプレート作成・試しフィット</text><text x="721" y="470" class="body">テンプレート担当｜接合条件を定義し、詳細部品に試しフィット</text><text x="721" y="490" class="body">テンプレートチェッカー｜フィット到達度と単体の形状差を確認</text>
<path d="M965 512V528" class="line" marker-end="url(#tip)"/>
<rect x="706" y="532" width="518" height="147" rx="10" class="box"/><text x="721" y="557" class="label">B5　再組み立て・空間検証</text><text x="721" y="577" class="body">空間CAD担当｜元の配置に組み戻す</text><text x="721" y="597" class="body">空間CADチェッカー｜対応する接合面の隙間・食い込み、開口を確認</text><text x="721" y="617" class="body">通過後、空間CAD担当が外側埋めも含めて円筒から差し引く</text><text x="721" y="637" class="body">空間CADチェッカー｜漏れ・連通・分断・微小面を確認</text><text x="721" y="657" class="body">NGなら原因に応じてB1（配置）・B2（方針）・B3（寸法）へ</text>
<path d="M965 679V700" class="line" marker-end="url(#tip)"/>
<rect x="706" y="704" width="518" height="87" rx="10" class="box"/><text x="721" y="729" class="label">B6　登録</text><text x="721" y="749" class="body">テンプレート担当｜検証結果・適用範囲・版を添えて登録</text><text x="721" y="769" class="body">Aからの改訂案件は、NGだったケースの再検証を通して登録</text>
<path d="M965 791V811" class="line" marker-end="url(#tip)"/><text x="706" y="837" class="label">出力｜登録済みテンプレート → A2で使用</text>
<text x="36" y="1051" class="muted">各工程の担当とチェッカーは別エージェント。黄色は人が判断する工程。</text>
</svg>
